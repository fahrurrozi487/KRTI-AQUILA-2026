# GUIDED: scan ArUco + drop + land WP3 (tanpa gate/yaw).
# Alias singkat; isi sama dengan mission_aruco_drop.yaml.
#
# Launch:
#   roslaunch mission_control phaseD_mission.launch \
#     mission:=aruco_only do_takeoff:=false sim_markers:=false \
#     use_gate:=false use_aruco:=true aruco_invert:=true
legs:
  - {wp: wp1, action: scan, expected_id: 1}
  - {wp: wp2, action: drop, expected_id: 2}
  - {wp: wp3, action: land, expected_id: 3}
